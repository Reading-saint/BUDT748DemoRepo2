<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUDT748 | Homepage</title>

  <!-- Bootstrap CSS (from the guide, Section 6 Step 2) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Montserrat font (matches the Figma design) -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

  <!-- Page styles -->
  <link href="css/styles.css" rel="stylesheet">

  <!-- Same styles embedded here so the page still looks right even if the css folder is missing -->
  <style>
/* Homepage styles (index.html) */

body {
  background-color: #000000;
  color: #ffffff;
  font-family: 'Montserrat', sans-serif;
  margin: 0;
  min-height: 100vh;
}

/* Navbar */
.navbar {
  background-color: #000000;
  padding: 16px 40px;
}

.navbar-brand {
  font-weight: 700;
  font-size: 48px;
  color: #ffffff !important;
}

.navbar-nav .nav-link {
  color: #ffffff !important;
  font-weight: 700;
  font-size: 18px;
  margin-left: 28px;
}

.navbar-nav .nav-link:hover {
  color: #A8FF35 !important;
}

/* Hero section */
.hero {
  text-align: center;
  padding: 100px 20px;
  max-width: 1000px;
  margin: 0 auto;
}

.hero-title {
  font-weight: 700;
  font-size: 60px;
  color: #ffffff;
  margin-bottom: 30px;
}

.hero-subtitle {
  font-weight: 400;
  font-size: 32px;
  color: #ffffff;
  max-width: 850px;
  margin: 0 auto 40px auto;
}

/* Get Started button: 180 x 57, radius 10, #A8FF35, 24px, drop shadow */
.btn-get-started {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 180px;
  height: 57px;
  background-color: #A8FF35;
  color: #000000;
  font-size: 24px;
  border-radius: 10px;
  text-decoration: none;
  box-shadow: 0 4px 10px rgba(168, 255, 53, 0.35);
  transition: transform 0.15s ease;
}

.btn-get-started:hover {
  color: #000000;
  transform: translateY(-2px);
}

/* Smaller screens */
@media (max-width: 768px) {
  .navbar { padding: 12px 20px; }
  .navbar-brand { font-size: 32px; }
  .navbar-nav .nav-link { margin-left: 0; }
  .hero { padding: 60px 16px; }
  .hero-title { font-size: 36px; }
  .hero-subtitle { font-size: 20px; }
}

/* Backup nav layout so it matches the design even if Bootstrap is slow to load */
.navbar .container-fluid { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.navbar-brand { text-decoration: none; }
.navbar-nav { display: flex; flex-direction: row; list-style: none; margin: 0; padding: 0; }
.navbar-nav .nav-link { text-decoration: none; }
.navbar-toggler { display: none; }
@media (max-width: 991px) {
  .navbar-toggler { display: block; background: transparent; border: 1px solid #555; border-radius: 6px; padding: 6px 10px; }
  .navbar-collapse { width: 100%; }
  .navbar-nav { flex-direction: column; padding-top: 10px; }
  .navbar-nav .nav-link { margin-left: 0; padding: 6px 0; }
}
  </style>
</head>
<body>

  <!-- Bootstrap Navbar (Section 6 Step 3) -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">BUDT748</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">Homepage</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <main class="hero">
    <h1 class="hero-title">LET'S CREATE A WEBSITE DESIGN</h1>
    <p class="hero-subtitle">
      Today let's create a sample website design in Figma and export its corresponding HTML and CSS code.
    </p>
    <a href="about.html" class="btn-get-started">Get Started</a>
  </main>

  <!-- Bootstrap JS (needed so the mobile hamburger menu opens) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
